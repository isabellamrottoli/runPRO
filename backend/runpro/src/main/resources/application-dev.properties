# ===== Dev DB: H2 in-memory =====
spring.datasource.url=jdbc:h2:mem:runpro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway off during dev (Hibernate manages schema)
spring.flyway.enabled=false

# ===== Server =====
server.port=8080
server.address=0.0.0.0

# ===== JWT (dev only — production must set APP_JWT_SECRET) =====
app.jwt.secret=dev-only-secret-override-in-production-min-32-bytes-xxxxxx

# ===== CORS (dev — bearer auth, no credentials, so wildcard is safe) =====
app.cors.allowed-origins=*
