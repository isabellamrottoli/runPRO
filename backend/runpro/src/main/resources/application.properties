spring.application.name=runpro

# ===== Dev DB: H2 in-memory =====
spring.datasource.url=jdbc:h2:mem:runpro;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Flyway off during dev (Hibernate manages schema)
spring.flyway.enabled=false

# ===== Server =====
server.port=8080
server.address=0.0.0.0

# ===== JWT =====
app.jwt.secret=change-me-please-this-is-a-dev-secret-at-least-32-bytes-long
app.jwt.expiration-hours=24

# ===== Actuator =====
management.endpoints.web.exposure.include=health
