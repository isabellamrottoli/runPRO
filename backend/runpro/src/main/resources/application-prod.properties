# ===== Prod DB: PostgreSQL (injected by the host) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none

# Flyway owns the schema in production
spring.flyway.enabled=true

# ===== H2 console disabled in production =====
spring.h2.console.enabled=false

# ===== Server =====
server.port=${PORT:8080}

# ===== JWT (required — app fails to start if APP_JWT_SECRET is missing) =====
app.jwt.secret=${APP_JWT_SECRET}

# ===== CORS (comma-separated allowlist of trusted origins) =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
